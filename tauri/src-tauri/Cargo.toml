[package]
name = "pdf-forge"
version = "2.0.0-alpha.4"
edition = "2021"
license = "AGPL-3.0-only"
default-run = "pdf-forge"

[lib]
name = "pdf_forge"
path = "src/lib.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]

[[bin]]
name = "pdf-forge"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.45"
pulldown-cmark = "0.13"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
same-file = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
webview2-com = "0.38"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
sha2 = "0.10"
